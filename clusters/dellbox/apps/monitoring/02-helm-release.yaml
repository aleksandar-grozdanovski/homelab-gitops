---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=65.0.0 <66.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  values:
    # Reduce resource usage for homelab (6GB RAM constraint)
    prometheus:
      prometheusSpec:
        retention: 7d
        resources:
          requests:
            memory: 400Mi
            cpu: 100m
          limits:
            memory: 800Mi
            cpu: 500m
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
    
    grafana:
      enabled: true
      adminPassword: "admin"  # Change this later!
      persistence:
        enabled: true
        size: 2Gi
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 200m
    
    alertmanager:
      enabled: false  # Disable to save resources
    
    # Disable some default scrapers to reduce load
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
